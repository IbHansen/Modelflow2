[build-system]
requires = ["setuptools>=77", "wheel"]   # >=77 for the SPDX license expression below
build-backend = "setuptools.build_meta"

[project]
name = "modelflowib"                       # PyPI distribution name
version = "2.82"                           # OVERWRITTEN at build time from MF_VERSION
                                            # (set_pyproject_version.py / make_pip.py -v)
description = "A tool to solve and manage dynamic economic and financial models"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"                            # SPDX expression (setuptools>=77)
license-files = ["license.md"]
authors = [{ name = "Ib Hansen", email = "Ib.Hansen.Iv@gmail.com" }]
keywords = ["economics", "dynamic models", "BLL", "numba", "modelling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# PyPI dependencies (pip names).
#
# The ones marked `sys_platform != "emscripten"` have no wasm build, or need a web
# server, so they can not be installed in a browser (JupyterLite/Pyodide). pip on a
# desktop installs them as before; micropip in the browser skips them. That makes
# `piplite.install("modelflowib")` work *with* its dependencies, so a notebook in
# JupyterLite needs no list of packages of its own.
dependencies = [
    # --- everywhere ---
    "pandas",
    "matplotlib",
    "seaborn",
    "sympy",
    "numpy",
    "networkx",
    "tqdm",
    "scipy",
    "XlsxWriter",
    "pyarrow",
    "tabulate",
    "openpyxl",
    "xarray",
    "jinja2",                  # pandas .style, used by the report and vis tables
    "ipython",                 # IPython.display, imported by most modules
    "ipywidgets",
    "ipydatagrid",
    "lmfit",                   # modelestimation, modelestimator_new
    "statsmodels",             # modelestimation, modelestimator_new
    # --- not in a browser ---
    "numba;                     sys_platform != 'emscripten'",
    "cvxopt;                    sys_platform != 'emscripten'",
    "numexpr;                   sys_platform != 'emscripten'",   # pandas accelerators
    "bottleneck;                sys_platform != 'emscripten'",
    "dash;                      sys_platform != 'emscripten'",   # needs a web server
    "dash-bootstrap-components; sys_platform != 'emscripten'",
    "dash-interactive-graphviz; sys_platform != 'emscripten'",
    "plotly;                    sys_platform != 'emscripten'",   # modeldashsidebar
    "jupyter;                   sys_platform != 'emscripten'",   # JupyterLite is the notebook there
]

[project.optional-dependencies]
shiny = ["shiny", "shinywidgets"]

[project.urls]
Homepage   = "https://github.com/IbHansen/ModelFlow2"
Repository = "https://github.com/IbHansen/ModelFlow2"

# --- flat layout: ship loose TOP-LEVEL modules so `from modelclass import model` works ---
# This list is the single source of truth for BOTH the PyPI wheel (make_pip.py reads it)
# and the conda build (pip install . consumes it). Experiments & scripts are excluded.
[tool.setuptools]
py-modules = [
    # core (11)
    "modelclass", "modelpattern", "modelmanipulation", "modelnormalize",
    "modelhelp", "modelBLfunk", "modeluserfunk", "model_financial_stability",
    "modelmf", "model_parquet_mixin", "model_cvx",
    # solve (3)
    "modelnewton", "modelinvert", "modeldiff","modelsolver_ng",
    # analysis (2)
    "modeldekom", "modelnet",
    # onboard (8)
    "modelgrabwf2", "modelgrab", "modelmacrograb", "modelgrabgdx",
    "model_dynare", "model_Excel", "model_latex", "model_latex_class",
    # construct (2)
    "modelconstruct", "modelconstruct_estimation",
    # estimate (2)
    "modelestimation", "modelestimator_new",
    # report (3)
    "modelreport", "modelhtml", "modeldisplay",
    # viz (8)
    "modelvis", "modeljupyter", "modeljupytermagic", "modelwidget",
    "modelwidget_input", "modeldash", "modeldashboot", "modeldashsidebar",
]
